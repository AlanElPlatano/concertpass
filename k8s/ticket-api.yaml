# ECR_REGISTRY lo reemplaza scripts/deploy-k8s.sh al aplicar el manifiesto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-api
  namespace: concertpass
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-api
  template:
    metadata:
      labels:
        app: ticket-api
    spec:
      containers:
        - name: ticket-api
          image: ECR_REGISTRY/ticket-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: concertpass-db
            - configMapRef:
                name: concertpass-config
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-api
  namespace: concertpass
spec:
  type: LoadBalancer
  selector:
    app: ticket-api
  ports:
    - port: 80
      targetPort: 8080
